<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codski</title>
  <style>
    :root {
      --bg-light: #f5f5f5;
      --text-light: #111;
      --bg-dark: #121212;
      --text-dark: #f5f5f5;
    }

    body {
      font-family: sans-serif;
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--text-dark);
      transition: background 0.3s, color 0.3s;
    }

    body.light {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    header, section {
      padding: 2rem;
      max-width: 960px;
      margin: auto;
    }

    header {
      text-align: center;
    }

    .toggle-theme {
      position: absolute;
      top: 1rem;
      right: 1rem;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 0.5rem;
    }

    .project, .blog-entry {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body class="dark">
  <button class="toggle-theme" onclick="
    document.body.classList.toggle('light');
    this.textContent = document.body.classList.contains('light') ? 'Lights off' : 'Lights on';
  ">Lights off</button>

  <header>
    <h1>Codski</h1>
    <p>Electrician-in-progress | Tinkerer | Builder</p>
  </header>

  <section id="portfolio">
    <h2>Projects</h2>
    <div class="gallery">
      <!-- Example project -->
      <div class="project">
        <img src="images/example.jpg" alt="Project Image" />
        <p>Project Title - Short description.</p>
      </div>
    </div>
  </section>

  <section id="resume">
    <h2>Resume</h2>
    <p>Add a brief summary or link to your downloadable resume here.</p>
  </section>

  <section id="blog">
    <h2>Blog / Updates</h2>
    <div class="blog-entry">
      <h3>First Post</h3>
      <p>This is where your latest update or blog post will go.</p>
    </div>
  </section>
</body>
</html>
